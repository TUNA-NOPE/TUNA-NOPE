<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a17"/>
      <stop offset="1" stop-color="#151935"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff9f43" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9dcc4"/>
      <stop offset="1" stop-color="#9c8b73"/>
    </linearGradient>
    <g id="moth">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.25 1;1 1" dur="0.16s" repeatCount="indefinite"/>
        <path d="M0 -2 C -10 -20, -34 -26, -40 -12 C -44 -2, -26 6, 0 2 Z" fill="url(#wing)"/>
        <path d="M0 2 C -18 6, -30 20, -20 26 C -12 30, -4 18, 0 6 Z" fill="#b8a688"/>
        <path d="M0 -2 C 10 -20, 34 -26, 40 -12 C 44 -2, 26 6, 0 2 Z" fill="url(#wing)"/>
        <path d="M0 2 C 18 6, 30 20, 20 26 C 12 30, 4 18, 0 6 Z" fill="#b8a688"/>
        <circle cx="-22" cy="-10" r="3.2" fill="#5a4a3a"/>
        <circle cx="22" cy="-10" r="3.2" fill="#5a4a3a"/>
      </g>
      <ellipse cx="0" cy="4" rx="3.6" ry="13" fill="#4a3c2f"/>
      <path d="M-1 -8 C -4 -16, -8 -20, -12 -22 M1 -8 C 4 -16, 8 -20, 12 -22" stroke="#4a3c2f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <style>
      .t { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .star { fill: #fff; animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .word { opacity: 0; animation: cyc 15s infinite; }
      @keyframes cyc { 0% { opacity: 0 } 2% { opacity: 1 } 18% { opacity: 1 } 20% { opacity: 0 } 100% { opacity: 0 } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .pulse { transform-origin: 250px 215px; animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.12); opacity: 1 } }
      .flame { transform-origin: 250px 228px; animation: flick .9s ease-in-out infinite alternate; }
      @keyframes flick { 0% { transform: scale(1,1) } 100% { transform: scale(.85,1.12) } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#sky)"/>

  <g>
    <circle class="star" cx="80" cy="60" r="1.4" style="animation-delay:0s"/>
    <circle class="star" cx="170" cy="340" r="1.1" style="animation-delay:1.3s"/>
    <circle class="star" cx="430" cy="50" r="1.6" style="animation-delay:2.1s"/>
    <circle class="star" cx="560" cy="370" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="690" cy="40" r="1.3" style="animation-delay:3s"/>
    <circle class="star" cx="820" cy="350" r="1.5" style="animation-delay:1.8s"/>
    <circle class="star" cx="960" cy="70" r="1.2" style="animation-delay:.9s"/>
    <circle class="star" cx="1110" cy="120" r="1.6" style="animation-delay:2.6s"/>
    <circle class="star" cx="1140" cy="360" r="1.1" style="animation-delay:.3s"/>
    <circle class="star" cx="40" cy="250" r="1.2" style="animation-delay:3.4s"/>
    <circle class="star" cx="1020" cy="250" r="1" style="animation-delay:1.1s"/>
    <circle class="star" cx="620" cy="110" r="1" style="animation-delay:2.4s"/>
  </g>

  <circle class="pulse" cx="250" cy="215" r="190" fill="url(#glow)"/>

  <!-- lantern -->
  <g>
    <path d="M250 70 v38" stroke="#6b5b4a" stroke-width="3"/>
    <circle cx="250" cy="66" r="9" fill="none" stroke="#6b5b4a" stroke-width="3"/>
    <path d="M214 120 h72 l-10 -14 h-52 z" fill="#3b3247"/>
    <rect x="218" y="120" width="64" height="118" rx="14" fill="url(#glass)"/>
    <path d="M232 124 v110 M268 124 v110" stroke="#c98a3a" stroke-width="2" opacity=".55"/>
    <path class="flame" d="M250 196 C 240 214, 240 232, 250 238 C 260 232, 260 214, 250 196 Z" fill="#ff7a1a"/>
    <path d="M212 238 h76 l-8 14 h-60 z" fill="#3b3247"/>
  </g>

  <!-- moths -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" path="M250 150 C 400 60, 420 300, 250 270 C 90 240, 100 40, 250 150 Z"/>
    <use href="#moth" transform="scale(.9)"/>
  </g>
  <g opacity=".75">
    <animateMotion dur="11s" repeatCount="indefinite" begin="-4s" path="M250 110 C 60 120, 120 330, 260 320 C 420 310, 430 100, 250 110 Z"/>
    <use href="#moth" transform="scale(.55) rotate(25)"/>
  </g>

  <!-- text -->
  <g class="t">
    <text x="510" y="170" font-size="76" font-weight="800" fill="#f6ead2" letter-spacing="-2">lanternmoth</text>
    <text x="514" y="236" font-size="30" fill="#9aa3c7">I build
      <tspan fill="#ffc46b" font-weight="700" dx="8"> </tspan></text>
    <text class="word" x="652" y="236" font-size="30" font-weight="700" fill="#ffc46b" style="animation-delay:0s">mobile apps</text>
    <text class="word" x="652" y="236" font-size="30" font-weight="700" fill="#ffc46b" style="animation-delay:3s">AI agents</text>
    <text class="word" x="652" y="236" font-size="30" font-weight="700" fill="#ffc46b" style="animation-delay:6s">dev tools</text>
    <text class="word" x="652" y="236" font-size="30" font-weight="700" fill="#ffc46b" style="animation-delay:9s">voice + speech</text>
    <text class="word" x="652" y="236" font-size="30" font-weight="700" fill="#ffc46b" style="animation-delay:12s">strange experiments</text>
    <text x="514" y="300" font-size="20" fill="#6f7799">things that work at 3am and still work in the morning<tspan class="caret" fill="#ffc46b"> ▍</tspan></text>
  </g>
</svg>
