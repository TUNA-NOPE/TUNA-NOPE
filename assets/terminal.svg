<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <style>
      .t { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 20px; }
      .p { fill: #ffc46b; } .c { fill: #e6e8f2; } .o { fill: #8d95b8; } .h { fill: #7ee0b5; } .d { fill: #8fb4ff; }
      .caret { fill: #ffc46b; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
    <!-- each line is revealed left to right, like typing -->
    <clipPath id="l1"><rect x="0" y="80" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="0.4s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="114" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="1.5s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="164" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="2.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="198" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="3.4s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="232" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="3.7s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="282" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="4.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="0" y="316" height="34" width="0"><animate attributeName="width" from="0" to="1200" begin="5.6s" dur="0.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1200" height="400" rx="18" fill="#0d1124"/>
  <rect width="1200" height="44" rx="18" fill="#161b36"/>
  <rect y="26" width="1200" height="18" fill="#161b36"/>
  <circle cx="30" cy="22" r="7" fill="#ff5f57"/><circle cx="54" cy="22" r="7" fill="#febc2e"/><circle cx="78" cy="22" r="7" fill="#28c840"/>
  <text class="t o" x="600" y="29" text-anchor="middle" font-size="15">lanternmoth — zsh</text>

  <g class="t">
    <text clip-path="url(#l1)" x="36" y="104"><tspan class="p">~ ❯ </tspan><tspan class="c">whoami</tspan></text>
    <text clip-path="url(#l2)" x="36" y="138" class="o">a moth that brought its own lamp. no face, no name, just commits.</text>

    <text clip-path="url(#l3)" x="36" y="188"><tspan class="p">~ ❯ </tspan><tspan class="c">ls ~/workbench</tspan></text>
    <text clip-path="url(#l4)" x="36" y="222"><tspan class="d">mobile-apps/  ai-agents/  dev-tools/  ui-design/  voice/</tspan></text>
    <text clip-path="url(#l5)" x="36" y="256"><tspan class="d">money-stuff/  automations/  browser-things/  half-baked/</tspan></text>

    <text clip-path="url(#l6)" x="36" y="306"><tspan class="p">~ ❯ </tspan><tspan class="c">cat ~/public.txt</tspan></text>
    <text clip-path="url(#l7)" x="36" y="340"><tspan class="h">macbox</tspan><tspan class="o">  ·  macOS + Xcode + iOS Simulator on Linux. more lamps lit soon.</tspan></text>
  </g>
  <rect class="caret" x="36" y="360" width="11" height="22" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.01s" fill="freeze"/>
  </rect>
</svg>
